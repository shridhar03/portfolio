<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b16" />
    <meta
      name="description"
      content="Shridhar Chavan: MERN developer, AI/ML and NLP enthusiast, and vibe coder from Satara, India."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <script>
      // Set theme before first paint to avoid a flash. Dark-first.
      try {
        if (localStorage.getItem('sc-theme') === 'light')
          document.documentElement.dataset.theme = 'light'
      } catch (e) {}
    </script>
  </head>
