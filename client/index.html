<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090a" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/anton-subset.woff2" crossorigin />
    <link
      rel="preload"
      as="image"
      type="image/avif"
      imagesrcset="/img/cutout-320.avif 320w, /img/cutout-480.avif 480w, /img/cutout-645.avif 645w"
      imagesizes="(min-width: 1024px) 25rem, (min-width: 640px) 20rem, 16rem"
      fetchpriority="high"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title data-prerender>Shridhar Chavan · MERN Developer</title>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      // Runs before first paint. Theme (dark-first) avoids a flash; the classes coordinate the
      // prerendered HTML with the JS intro (see IntroProvider and the hero in index.css).
      ;(function (d) {
        try {
          if (localStorage.getItem('sc-theme') === 'light') d.dataset.theme = 'light'
        } catch (e) {}
        if (!matchMedia('(prefers-reduced-motion: no-preference)').matches) return
        d.classList.add('motion-ok')
        var seen = null
        try {
          seen = sessionStorage.getItem('sc-visited') || localStorage.getItem('sc-visited')
        } catch (e) {}
        if (seen !== '1') d.classList.add('intro-pending')
      })(document.documentElement)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
