<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 920" width="820" height="920"><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#8d8d93"><text x="40" y="44" fill-opacity="1" xml:space="preserve"><tspan fill="#d92b20">import</tspan> winkNLP <tspan fill="#d92b20">from</tspan> 'wink-nlp'</text><text x="40" y="63" fill-opacity="1" xml:space="preserve"><tspan fill="#d92b20">import</tspan> model <tspan fill="#d92b20">from</tspan> 'wink-eng-lite-web-model'</text><text x="40" y="82" fill-opacity="1" xml:space="preserve"><tspan fill="#d92b20">const</tspan> nlp = winkNLP(model)</text><text x="40" y="101" fill-opacity="1" xml:space="preserve"><tspan fill="#d92b20">const</tspan> its = nlp.its</text><text x="40" y="120" fill-opacity="1" xml:space="preserve"><tspan fill="#d92b20">export</tspan> <tspan fill="#d92b20">type</tspan> Intent = 'resume' | 'projects' | 'contact' | 'off-topic'</text><text x="40" y="139" fill-opacity="1" xml:space="preserve"><tspan fill="#d92b20">const</tspan> KEYWORDS: Record&lt;Exclude&lt;Intent, 'off-topic'&gt;, string[]&gt; = {</text><text x="40" y="158" fill-opacity="1" xml:space="preserve">  contact: [</text><text x="40" y="177" fill-opacity="0.9" xml:space="preserve">  ],</text><text x="40" y="196" fill-opacity="0.9" xml:space="preserve">  projects: [</text><text x="40" y="215" fill-opacity="0.9" xml:space="preserve">  ],</text><text x="40" y="234" fill-opacity="0.9" xml:space="preserve">  resume: [</text><text x="40" y="253" fill-opacity="0.9" xml:space="preserve">  ],</text><text x="40" y="272" fill-opacity="0.9" xml:space="preserve">}</text><text x="40" y="291" fill-opacity="0.9" xml:space="preserve"><tspan fill="#d92b20">const</tspan> OFF_TOPIC = [</text><text x="40" y="310" fill-opacity="0.8" xml:space="preserve">]</text><text x="40" y="329" fill-opacity="0.8" xml:space="preserve"><tspan fill="#d92b20">const</tspan> toSet = (a: string[]) =&gt; <tspan fill="#d92b20">new</tspan> Set(a)</text><text x="40" y="348" fill-opacity="0.8" xml:space="preserve"><tspan fill="#d92b20">const</tspan> SETS = {</text><text x="40" y="367" fill-opacity="0.8" xml:space="preserve">  contact: toSet(KEYWORDS.contact),</text><text x="40" y="386" fill-opacity="0.8" xml:space="preserve">  projects: toSet(KEYWORDS.projects),</text><text x="40" y="405" fill-opacity="0.7" xml:space="preserve">  resume: toSet(KEYWORDS.resume),</text><text x="40" y="424" fill-opacity="0.7" xml:space="preserve">  off: toSet(OFF_TOPIC),</text><text x="40" y="443" fill-opacity="0.7" xml:space="preserve">}</text><text x="40" y="462" fill-opacity="0.7" xml:space="preserve"><tspan fill="#d92b20">export</tspan> <tspan fill="#d92b20">function</tspan> tokensOf(text: string) {</text><text x="40" y="481" fill-opacity="0.7" xml:space="preserve">  <tspan fill="#d92b20">const</tspan> doc = nlp.readDoc(text.toLowerCase())</text><text x="40" y="500" fill-opacity="0.6" xml:space="preserve">  <tspan fill="#d92b20">const</tspan> words = doc.tokens().filter((t) =&gt; t.out(its.<tspan fill="#d92b20">type</tspan>) === 'word')</text><text x="40" y="519" fill-opacity="0.6" xml:space="preserve">  <tspan fill="#d92b20">return</tspan> <tspan fill="#d92b20">new</tspan> Set&lt;string&gt;([</text><text x="40" y="538" fill-opacity="0.6" xml:space="preserve">    ...words.out(),</text><text x="40" y="557" fill-opacity="0.6" xml:space="preserve">    ...(words.out(its.lemma as never) as string[]),</text><text x="40" y="576" fill-opacity="0.5" xml:space="preserve">    ...(words.out(its.stem as never) as string[]),</text><text x="40" y="595" fill-opacity="0.5" xml:space="preserve">  ])</text><text x="40" y="614" fill-opacity="0.5" xml:space="preserve">}</text><text x="40" y="633" fill-opacity="0.4" xml:space="preserve"><tspan fill="#d92b20">export</tspan> <tspan fill="#d92b20">function</tspan> detectIntent(text: string): Intent {</text><text x="40" y="652" fill-opacity="0.4" xml:space="preserve">  <tspan fill="#d92b20">const</tspan> tokens = tokensOf(text)</text><text x="40" y="671" fill-opacity="0.4" xml:space="preserve">  <tspan fill="#d92b20">const</tspan> score = (s: Set&lt;string&gt;) =&gt; [...tokens].filter((t) =&gt; s.has(t)).length</text><text x="40" y="690" fill-opacity="0.4" xml:space="preserve">  <tspan fill="#d92b20">const</tspan> scores = {</text><text x="40" y="709" fill-opacity="0.3" xml:space="preserve">    contact: score(SETS.contact),</text><text x="40" y="728" fill-opacity="0.3" xml:space="preserve">    projects: score(SETS.projects),</text><text x="40" y="747" fill-opacity="0.3" xml:space="preserve">    resume: score(SETS.resume),</text><text x="40" y="766" fill-opacity="0.2" xml:space="preserve">  }</text><text x="40" y="785" fill-opacity="0.2" xml:space="preserve">  <tspan fill="#d92b20">const</tspan> off = score(SETS.off)</text><text x="40" y="804" fill-opacity="0.2" xml:space="preserve">  <tspan fill="#d92b20">const</tspan> onTopic = scores.contact + scores.projects + scores.resume</text><text x="40" y="823" fill-opacity="0.1" xml:space="preserve">    tokens.has(w),</text><text x="40" y="842" fill-opacity="0.1" xml:space="preserve">  )</text><text x="40" y="861" fill-opacity="0.1" xml:space="preserve">  <tspan fill="#d92b20">if</tspan> (</text><text x="40" y="880" fill-opacity="0" xml:space="preserve">    injection &amp;&amp;</text><text x="40" y="899" fill-opacity="0" xml:space="preserve">  )</text></g></svg>